<!doctype html>
<html><body><script>
/* preview-patched.html を ?page=graph 相当で開き、コンソールを中継する */
const iframe = document.createElement("iframe");
iframe.src = "../preview-patched.html?page=graph";
iframe.style.cssText = "width:1280px;height:900px;border:0;";
document.body.appendChild(iframe);
window.addEventListener("error", (e) => console.log("HARNESS ERROR: " + e.message));
setTimeout(() => {
  try {
    const doc = iframe.contentDocument;
    const active = doc.querySelector(".page.active");
    console.log("ACTIVE PAGE: " + (active ? active.dataset.view : "none"));
    console.log("RELATION ROWS: " + doc.querySelectorAll("#relation-table tr").length);
    console.log("GRAPH STATS: " + doc.querySelector("#graph-stats").textContent.trim());
    console.log("CANVAS CHILDREN: " + doc.querySelector("#graph-canvas").children.length);
    console.log("DETAIL: " + doc.querySelector("#graph-detail").textContent.slice(0, 80));
  } catch (e) { console.log("INSPECT FAIL: " + e.message); }
}, 4500);
</script></body></html>
